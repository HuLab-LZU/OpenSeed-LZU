[project]
name = "OpenSeed-LZU"
version = "0.1.0"
description = "OpenSeed: Towards an Open-Source Seed Image Analysis Ecosystem."
authors = []
requires-python = "==3.11.*"
readme = "README.md"
license = { text = "Apache License v2.0" }

dependencies = [
    "einops>=0.8.1",
    "h5py>=3.13.0",
    "hydra-core",
    "hydra-colorlog",
    "hydra-optuna-sweeper",
    "ipykernel>=6.29.5",
    "lightning>=2.5.0.post0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "opencv-python-headless>=4.11.0.86",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pip>=25.0.1",
    "rich>=13.9.4",
    "rootutils>=1.0.7",
    "setuptools",
    "tensorboard>=2.19.0",
    "torch==2.6.0",
    "torchvision",
    "torchmetrics>=1.6.3",
    "timm>=1.0.15",
    "seaborn>=0.13.2",
    "scikit-learn>=1.6.1",
    "onnxruntime>=1.21.0",
    "onnx>=1.17.0",
    "onnxconverter-common>=1.14.0",
    "onnxruntime-gpu>=1.21.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.4",
    "brokenaxes>=0.6.2",
    "grad-cam>=1.5.5",
    "ipywidgets>=8.1.5",
    "lxml>=5.4.0",
    "mnn>=3.1.1",
    "pybind11>=2.13.6",
    "statsmodels>=0.14.4",
    "torchinfo",
    "watchdog>=6.0.0",
]

[tool.uv.sources]
hydra-core = { git = "https://github.com/facebookresearch/hydra.git" }
hydra-colorlog = { git = "https://github.com/facebookresearch/hydra.git", subdirectory = "plugins/hydra_colorlog" }
hydra-optuna-sweeper = { git = "https://github.com/facebookresearch/hydra.git", subdirectory = "plugins/hydra_optuna_sweeper" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

# [[tool.uv.index]]
# name = "pytorch_cu118"
# url = "https://download.pytorch.org/whl/cu118"
# explicit = true

[[tool.uv.index]]
name = "pytorch_nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "data/dataset"]

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
    "--doctest-modules",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
log_cli = true
markers = ["slow: slow tests"]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.marimo.save]
format_on_save = true
autosave_delay = 1000
autosave = "after_delay"
